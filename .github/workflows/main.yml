# Save as .github/workflows/constellation.yml
# Generated by GitHub Constellation. Settings and CSS match the preview.
name: Daily constellation
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: constellation-output
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mnichols08/constellation@v1
        with:
          publish: 'true'
          config-json: |
            {
              "theme": "auto",
              "layout": "compact",
              "maxRepos": 100,
              "animate": true,
              "includeForks": true,
              "bridges": true,
              "connectionDensity": "all",
              "connectionBasis": "both",
              "languages": null,
              "topics": null,
              "showOther": false,
              "css": "/* Visual controls: light palette, then the viewer’s dark preference. */\nsvg {\n  --sky-background: #f7f8fc;\n  --sky-foreground: #18213a;\n  --sky-accent: #395bbe;\n  --sky-line: #aab6d3;\n  --sky-star: #966500;\n}\n@media (prefers-color-scheme: dark) {\n  svg {\n    --sky-background: #080e20;\n    --sky-foreground: #e6edff;\n    --sky-accent: #9ab9ff;\n    --sky-line: #3e537e;\n    --sky-star: #f6d99b;\n  }\n}\n.connections { stroke-width: 0.9; opacity: 0.8; }\n.shared-language[data-emphasis=\"secondary\"] { opacity: 0.13; }\n.bridges { stroke-width: 0.9; opacity: 0.35; }\n.star { filter: drop-shadow(0 0 2px var(--sky-star)); }\n.dust { opacity: 0.5; }\n.language text, .repo-label { font-size: 10px; }\n.language, .repo-label { display: inline; }\n"
            }
